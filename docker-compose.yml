services:
  socialpilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # local machine only; there is no authentication
    environment:
      SOCIALPILOT_MOCK_MODE: "1"
    volumes:
      - socialpilot_db:/data    # database only, so rebuilds pick up new code
    restart: unless-stopped
volumes:
  socialpilot_db:
